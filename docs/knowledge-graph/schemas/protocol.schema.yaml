$schema: "http://json-schema.org/draft-07/schema#"
title: protocol node
type: object
required: [id, ntype, label, transport]
additionalProperties: false
properties:
  id:
    type: string
    minLength: 1
  ntype:
    const: protocol
  label:
    type: string
    minLength: 1
  kind:
    description: is this a wire transport, a wire protocol, or a rendering paradigm
    enum: [transport, protocol, rendering]
  transport:
    description: underlying transport class; rendering paradigms use "n/a"
    enum: [SSE, WebSocket, stdio, "n/a"]
