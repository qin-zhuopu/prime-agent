$schema: "http://json-schema.org/draft-07/schema#"
title: repo node
type: object
required: [id, ntype, label]
additionalProperties: false
properties:
  id:
    type: string
    pattern: "^[A-Z][A-Z0-9]*$"
  ntype:
    const: repo
  label:
    type: string
    minLength: 1
  license:
    type: string
