$schema: "http://json-schema.org/draft-07/schema#"
title: repo node
type: object
required: [id, ntype, label, tier]
additionalProperties: false
properties:
  id:
    type: string
    pattern: "^[A-Z][A-Z0-9]*$"
  ntype:
    const: repo
  label:
    type: string
    minLength: 1
  tier:
    enum: [primary, survey]
  stack:
    type: string
  license:
    type: string
  transport:
    description: backend transport(s) for agent<->frontend streaming
    type: array
    items:
      enum: [SSE, WebSocket, stdio, "none/unknown"]
  integration:
    description: how the agent is integrated / consumed (integration surface)
    type: array
    items:
      enum: ["REST+SSE", "WebSocket", "stdio-rpc", "in-process-sdk"]
  browser_native:
    description: >-
      can a plain browser tab talk to the agent directly, without a host
      (Node/Tauri/Electron) spawning a child process? stdio-rpc agents are false.
    type: boolean
  protocols:
    description: protocol node ids this repo uses
    type: array
    items:
      type: string
